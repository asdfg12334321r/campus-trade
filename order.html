<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单列表 - 校园二手交易平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🏪 校园二手交易平台</h1>
            <p>让闲置物品焕发新生命</p>
        </div>

        <!-- 导航 -->
        <div class="navbar">
            <a href="index.html" class="nav-link">首页</a>
            <a href="item.html" class="nav-link">商品列表</a>
            <a href="user.html" class="nav-link">用户列表</a>
            <a href="order.html" class="nav-link active">订单列表</a>
        </div>

        <!-- 消息提示 -->
        <div id="message" class="message"></div>

        <!-- 页面内容 -->
        <div class="content">
            <h2>订单列表</h2>
            
            <!-- 连接查询面板 -->
            <div class="query-panel">
                <h3>🔗 连接查询</h3>
                <div class="query-buttons">
                    <button class="btn btn-query" onclick="querySoldItemsWithBuyer()">✓ 已售商品及买家</button>
                    <button class="btn btn-query" onclick="queryOrdersDetail()">📋 订单详情（商品+买家+日期）</button>
                    <button class="btn btn-query" onclick="queryU001SoldStatus()">🔍 u001的商品购买情况</button>
                    <button class="btn btn-query" onclick="showAllOrders()">🔄 显示所有订单</button>
                </div>
            </div>

            <!-- 表格容器 -->
            <div id="contentContainer" class="table-wrapper"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <script src="app.js"></script>
    <script>
        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            showMessage('加载订单列表页面', 'info');
        });
    </script>
</body>
</html>
